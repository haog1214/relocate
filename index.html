<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RE:LOCATE｜關稅政策下的遷移計畫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css?v=20261125k">
  <link rel="stylesheet" href="css/base.css?v=20261125k">
  <link rel="stylesheet" href="css/layout.css?v=20261125k">
  <link rel="stylesheet" href="css/components.css?v=20261125k">
  <link rel="stylesheet" href="css/mobile.css?v=20261125k">
</head>
<body>
  <div id="root">
    <div id="stage" role="region" aria-roledescription="簡報" aria-label="RE:LOCATE 關稅政策下的遷移計畫">

      <!-- ========== 第 1 頁：封面 ========== -->
      <section id="cover" class="cover" data-index="0" aria-label="第 1 頁：封面">
        <div class="ghost-word cover__ghost" aria-hidden="true">RELOCATE</div>

        <!-- 左下角拼貼風人物：黑白去背＋白色貼紙描邊＋紅色潑墨＋膠帶 -->
        <figure class="cover__figure" aria-hidden="true">
          <img class="cover__splat" src="assets/img/splatter-red.svg" alt="">
          <img class="cover__person" src="assets/img/trump-cutout.png" alt="">
          <span class="cover__tape"></span>
        </figure>

        <header class="cover__top">
          <div class="brand fx">
            <span class="brand__mark">RE:LOCATE</span>
            <span class="brand__sub">關稅下的產線新布局</span>
          </div>
          <div class="cover__topright">
            <span class="t-label fx">PROJECT MANAGEMENT · 2026</span>
            <ul class="cover__meta fx">
              <li><span class="t-label">COURSE</span><span>專案管理學　期末報告<span class="cover__advisors">指導老師：蔡勝男、朱南玉、何智超</span></span></li>
              <li><span class="t-label">TEAM</span>第 4 組</li>
            </ul>
          </div>
        </header>

        <div class="cover__main">
          <!-- 原文：一句話影響全世界的男人 -->
          <p class="t-label cover__eyebrow fx">ONE SENTENCE. THE WHOLE WORLD MOVES.</p>
          <!-- 主標題：放在原本 RE:LOCATE 大字的位置，分兩行，每行貼在紙條上 -->
          <h1 class="cover__headline" aria-label="關稅政策下的遷移計畫">
            <span class="cover__strip split">關稅政策下的</span>
            <span class="cover__strip split">遷移計畫</span>
          </h1>
          <p class="cover__lead fx">從美國關稅危機到泰國開創新局</p>
        </div>

        <div class="cover__visual" aria-hidden="true">
          <!-- 地球儀（由 js/render.js 依 js/globe.js 繪製）：TAIWAN（台中）→ THAILAND（曼谷） -->
          <div class="globe-slot"></div>
        </div>
        <!-- 圓標按鈕：點擊後地球儀轉回初始視角（台灣、泰國面向前方），見 js/globe.js -->
        <!-- 外觀：立體按鈕（白色底座＋深藍圓頂＋白色輻射／核彈圖示） -->
        <button type="button" class="badge-circle cover__badge fx-pop" aria-label="地球儀轉回初始位置：台灣到泰國">
          <svg class="nuke-icon" viewBox="-50 -50 100 100" aria-hidden="true">
            <path d="M22.50 -38.97A45 45 0 0 1 45.00 0.00L15.00 0.00A15 15 0 0 0 7.50 -12.99ZM-45.00 0.00A45 45 0 0 1 -22.50 -38.97L-7.50 -12.99A15 15 0 0 0 -15.00 0.00ZM22.50 38.97A45 45 0 0 1 -22.50 38.97L-7.50 12.99A15 15 0 0 0 7.50 12.99Z"/>
            <circle r="10"/>
          </svg>
        </button>

        <div class="scroll-hint" aria-hidden="true">
          <span class="t-label">SCROLL</span>
          <span class="scroll-hint__line"><i></i></span>
        </div>
      </section>

      <!-- ========== 第 2 頁以後 ========== -->
      <div id="deck" class="deck">
        <nav id="sidebar" class="sidebar" aria-label="章節進度"></nav>
        <div id="slides" class="slides">
          <!-- 由 js/render.js 產生 -->
          <div id="wipe" class="wipe" aria-hidden="true">
            <div class="wipe__stripe wipe__stripe--navy">
              <div class="wipe__label">
                <span class="wipe__no">01</span>
                <span class="wipe__en">BACKGROUND</span>
                <span class="wipe__zh">背景與目的</span>
              </div>
            </div>
            <div class="wipe__stripe wipe__stripe--red"></div>
          </div>
        </div>
      </div>

      <p id="live" class="sr-only" aria-live="polite"></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="data/slides.js?v=20261125k"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.0/dist/d3-geo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="data/world.js?v=20261125k"></script>
  <script src="js/globe.js?v=20261125k"></script>
  <script src="js/stage.js?v=20261125k"></script>
  <script src="js/render.js?v=20261125k"></script>
  <script src="js/sidebar.js?v=20261125k"></script>
  <script src="js/motion.js?v=20261125k"></script>
  <script src="js/navigator.js?v=20261125k"></script>
</body>
</html>
